# Chat colours: the colour of the messages a player writes.
#
# Players pick one with /chatcolor equip <id>. Each one needs the permission spectrum.chat.<id>
# (spectrum.chat.* gives all of them), or set your own with `permission:`.
#
# A style is written in one of two ways.
#
# 1. With colours:
#      mode      SINGLE    one colour
#                GRADIENT  a smooth fade through the colours
#                LINEAR    the colours one after the other, over and over
#                RANDOM    a random one of the colours for every letter
#                RAINBOW   the rainbow, no colour list needed
#      colors    #rrggbb, a name (dark_red) or an old code (4, c)
#      bold, italic, underline, strikethrough, obfuscated    true or false
#      ignore-spaces   for LINEAR: spaces do not use up a colour
#      glitch    true: white letters with a shadow in the colour of the style (see config.yml)
#
# 2. With a MiniMessage format, where {text} is the message. Anything MiniMessage has works:
#    <gradient:#ff0000:#0000ff>, <rainbow>, <bold> and so on.
#    https://docs.advntr.dev/minimessage/format.html
#
# `display` is the name in /chatcolor list and menus, it is coloured with the style.

# The style players get without picking one, if they may use it. Leave empty for none.
default: ''

styles:
  # ---- one colour ----
  rose:
    display: "Rose"
    mode: SINGLE
    colors: ["#ff7aa8"]
  mint:
    display: "Mint"
    colors: ["#7dffc4"]
  gold:
    display: "Gold"
    colors: ["#ffcc33"]
    bold: true

  # ---- gradients ----
  sunset:
    display: "Sunset"
    mode: GRADIENT
    colors: ["#ff512f", "#f09819", "#ffd200"]
  ocean:
    display: "Ocean"
    mode: GRADIENT
    colors: ["#00c6ff", "#0072ff"]
  aurora:
    display: "Aurora"
    mode: GRADIENT
    colors: ["#00ff87", "#60efff", "#c471ed"]
  royal:
    display: "Royal"
    mode: GRADIENT
    colors: ["#ffd700", "#ff8c00"]
    bold: true

  # ---- other modes ----
  rainbow:
    display: "Rainbow"
    mode: RAINBOW
  candy:
    display: "Candy"
    mode: LINEAR
    colors: ["#ff9ac1", "#ffffff"]
    ignore-spaces: true
  sparkle:
    display: "Sparkle"
    mode: RANDOM
    colors: ["#fff6a8", "#ffd1ff", "#b8f0ff", "#ffffff"]

  # ---- glitch ----
  # glitch: true gives white letters with a shadow in the colour of the style (see `glitch:` in config.yml).
  red_glitch:
    display: "Red Glitch"
    colors: ["#f13a3a"]
    glitch: true
  orange_glitch:
    display: "Orange Glitch"
    colors: ["#ff9558"]
    glitch: true
  yellow_glitch:
    display: "Yellow Glitch"
    colors: ["#ffe05a"]
    glitch: true
  green_glitch:
    display: "Green Glitch"
    colors: ["#5cf07a"]
    glitch: true
  cyan_glitch:
    display: "Cyan Glitch"
    colors: ["#3adcf1"]
    glitch: true
  blue_glitch:
    display: "Blue Glitch"
    colors: ["#3a7af1"]
    glitch: true
  purple_glitch:
    display: "Purple Glitch"
    colors: ["#a35cf0"]
    glitch: true
  rainbow_glitch:
    display: "Rainbow Glitch"
    mode: RAINBOW
    glitch: true

  # ---- MiniMessage formats ----
  matrix:
    display: "Matrix"
    format: "<#00ff41><obfuscated>0</obfuscated>{text}<obfuscated>1</obfuscated>"
  frost:
    display: "Frost"
    format: "<gradient:#e6f7ff:#7fd0ff:#e6f7ff>{text}</gradient>"
  lava:
    display: "Lava"
    format: "<gradient:#ff0000:#ff9100:#ffea00>{text}</gradient>"
  neon:
    display: "Neon"
    format: "<bold><gradient:#ff00ff:#00ffff>{text}</gradient></bold>"
